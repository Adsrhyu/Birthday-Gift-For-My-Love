    <!-- 🎵 Instant Auto-Play Audio (Starts immediately upon clicking/entering web) -->
    <audio id="birthday-audio" src="./birthday_sound.mp3" autoplay playsinline loop preload="auto" style="position:fixed;top:-100px;left:-100px;width:1px;height:1px;opacity:0.001;pointer-events:none;"></audio>
    <script>
      (function() {
        var audio = document.getElementById('birthday-audio');
        if (!audio) return;
        audio.volume = 0.85;

        var startPlay = function() {
          if (!audio) return;
          audio.muted = false;
          audio.volume = 0.85;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function() {
              console.log('Unmuted autoplay active!');
            }).catch(function(e) {
              console.log('Autoplay waiting for initial touch:', e.message);
              // Warm pipeline muted so playback starts instantly on first touch
              try {
                audio.muted = true;
                audio.play().catch(function(){});
              } catch(err) {}
            });
          }
        };

        window.__playBirthdayMusic = function() {
          if (!audio) return;
          audio.muted = false;
          audio.volume = 0.85;
          if (audio.paused) {
            audio.play().catch(function(e) {
              console.log('play error:', e);
            });
          }
        };
        window.__birthdayAudio = audio;

        // Attempt playback immediately and on every page lifecycle event
        startPlay();

        ['DOMContentLoaded', 'load', 'pageshow', 'focus', 'readystatechange'].forEach(function(evt) {
          window.addEventListener(evt, startPlay, { passive: true });
          document.addEventListener(evt, startPlay, { passive: true });
        });
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') startPlay();
        });

        // Continuous retry polling every 120ms for the first 6 seconds
        var attempts = 0;
        var retryTimer = setInterval(function() {
          attempts++;
          if (!audio || (!audio.paused && !audio.muted) || attempts > 50) {
            clearInterval(retryTimer);
            return;
          }
          startPlay();
        }, 120);

        // Broad passive unlock on any finger movement / touch / scroll anywhere
        var unlockEvents = ['touchstart', 'touchend', 'touchmove', 'pointerdown', 'pointermove', 'mousedown', 'click', 'scroll', 'keydown'];
        var unlockHandler = function() {
          window.__playBirthdayMusic();
        };

        unlockEvents.forEach(function(evt) {
          window.addEventListener(evt, unlockHandler, { capture: true, passive: true });
          document.addEventListener(evt, unlockHandler, { capture: true, passive: true });
        });

        // Prevent unsolicited Chrome PWA install banners
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
        });
      })();
    </script>
